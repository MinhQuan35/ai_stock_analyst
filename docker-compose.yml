version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  api:
    build: .
    container_name: ai_stock_analyst_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    command: python main.py api --host 0.0.0.0 --port 8000

volumes:
  qdrant_storage:
